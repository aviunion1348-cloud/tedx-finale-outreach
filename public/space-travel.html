<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital — Cinematic Space Travel</title>

  <!-- ===== PINNED CDN STACK ===== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ===== TAILWIND CONFIG ===== -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { heading: ['"Instrument Serif"','serif'], body: ['Barlow','sans-serif'] },

  <!-- ===== LIQUID GLASS + MOTION CSS ===== -->
  <style>
    body { background:#000; color:#fff; font-family:'Barlow',sans-serif; overflow-x:hidden; -webkit-font-smoothing:antialiased; }

    /* Liquid Glass (subtle) — exact spec */
    .liquid-glass{
      background:rgba(255,255,255,0.01); background-blend-mode:luminosity;
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); border:none;
      box-shadow:inset 0 1px 1px rgba(255,255,255,0.1); position:relative; overflow:hidden;
    }
    .liquid-glass::before{
      content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
      background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
    }
    /* Liquid Glass Strong — exact spec */
    .liquid-glass-strong{
      background:rgba(255,255,255,0.01); background-blend-mode:luminosity;
      backdrop-filter:blur(50px); -webkit-backdrop-filter:blur(50px); border:none;
      box-shadow:4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15); position:relative; overflow:hidden;
    }
    .liquid-glass-strong::before{
      content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
      background:linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.2) 80%,rgba(255,255,255,0.5) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
    }

    /* ---- animation systems ---- */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(10px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
    .animate-fade-in-up{animation:fadeInUp .8s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    @keyframes nebulaDrift{0%{transform:translate3d(-4%,-2%,0) scale(1);opacity:.25}50%{transform:translate3d(4%,3%,0) scale(1.15);opacity:.5}100%{transform:translate3d(-4%,-2%,0) scale(1);opacity:.25}}
    .nebula{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:nebulaDrift 22s ease-in-out infinite;mix-blend-mode:screen}
    @keyframes shoot{0%{transform:translate(0,0) rotate(-30deg);opacity:0}8%{opacity:1}30%{transform:translate(-40vw,22vh) rotate(-30deg);opacity:0}100%{transform:translate(-40vw,22vh) rotate(-30deg);opacity:0}}
    .shooting-star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff,0 0 20px rgba(255,255,255,.6);animation:shoot 8s linear infinite;opacity:0}
    #scroll-progress{position:fixed;top:0;left:0;height:2px;z-index:100;width:0%;background:linear-gradient(90deg,rgba(255,255,255,.4),#fff,rgba(255,255,255,.4));box-shadow:0 0 12px rgba(255,255,255,.6)}
    @keyframes softPulse{0%,100%{box-shadow:inset 0 1px 1px rgba(255,255,255,.15),0 0 0 0 rgba(255,255,255,.1)}50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 0 30px 2px rgba(255,255,255,.08)}}
    .soft-pulse{animation:softPulse 3s ease-in-out infinite}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .marquee-track{display:flex;width:max-content;animation:marquee 30s linear infinite}
    .marquee:hover .marquee-track{animation-play-state:paused}
    .tilt-card{transform-style:preserve-3d;will-change:transform;transition:transform .4s cubic-bezier(.22,1,.36,1)}
    @keyframes shine{to{background-position:-200% 0}}
    .text-shine{background:linear-gradient(100deg,#fff 20%,rgba(255,255,255,.4) 40%,#fff 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}

    /* batch 1 */
    @keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes floatDown{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
    @keyframes spinSlow{to{transform:rotate(360deg)}}
    @keyframes spinBack{to{transform:rotate(-360deg)}}
    @keyframes orbit{from{transform:rotate(0) translateX(var(--r)) rotate(0)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}97%{opacity:.6}98%{opacity:1}}
    @keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}100%{transform:translate(0)}}
    @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes comet{0%{transform:translate(-10vw,-10vh);opacity:0}10%{opacity:1}100%{transform:translate(90vw,90vh);opacity:0}}
    @keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
    @keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    @keyframes shimmerW{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
    @keyframes dashMove{to{stroke-dashoffset:-200}}
    @keyframes starDrift{from{transform:translateY(0)}to{transform:translateY(-100vh)}}
    .star-field{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:starDrift linear infinite;animation-duration:var(--d,20s)}

    /* batch 2 */
    @keyframes driftX{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
    @keyframes driftY{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
    @keyframes tiltZ{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
    @keyframes scaleP{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    @keyframes blurPulse{0%,100%{filter:blur(0)}50%{filter:blur(3px)}}
    @keyframes rotate3d{from{transform:rotate3d(1,1,0,0)}to{transform:rotate3d(1,1,0,360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}}
    @keyframes flipY{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
    @keyframes popIn{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes sideGlow{0%,100%{box-shadow:0 0 6px rgba(255,255,255,.1)}50%{box-shadow:0 0 24px rgba(255,255,255,.35)}}

    .anim-floatUp{animation:floatUp 5s ease-in-out infinite}
    .anim-floatDown{animation:floatDown 5.5s ease-in-out infinite}
    .anim-spinSlow{animation:spinSlow 12s linear infinite}
    .anim-spinBack{animation:spinBack 14s linear infinite}
    .anim-orbit{animation:orbit 9s linear infinite}
    .anim-breathe{animation:breathe 4s ease-in-out infinite}
    .anim-flicker{animation:flicker 5s linear infinite}
    .anim-glitch:hover{animation:glitch .4s steps(2) infinite}
    .anim-twinkle{animation:twinkle 3s ease-in-out infinite}
    .anim-comet{animation:comet 12s linear infinite}
    .anim-ring-pulse{animation:ringPulse 2.5s infinite}
    .anim-wave{transform-origin:bottom;animation:wave 1s ease-in-out infinite}
    .anim-sweep{position:relative;overflow:hidden}
    .anim-sweep::after{content:"";position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 2.6s ease-in-out infinite}
    .anim-gradient-flow{background:linear-gradient(90deg,#fff,#9ad,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientFlow 6s ease infinite}
    .anim-glow-pulse{animation:glowPulse 3s ease-in-out infinite}
    .anim-driftX{animation:driftX 6s ease-in-out infinite}
    .anim-driftY{animation:driftY 7s ease-in-out infinite}
    .anim-tiltZ{animation:tiltZ 5s ease-in-out infinite}
    .anim-scaleP{animation:scaleP 3s ease-in-out infinite}
    .anim-blur-pulse{animation:blurPulse 5s ease-in-out infinite}
    .anim-rotate3d{animation:rotate3d 6s linear infinite}
    .anim-bob{animation:bob 5s ease-in-out infinite}
    .anim-flipY{animation:flipY 3s linear infinite}
    .anim-pop-in{animation:popIn .5s cubic-bezier(.22,1,.36,1) both}
    .anim-fade-in{animation:fadeIn 1s ease both}
    .anim-rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
    .anim-blink{animation:blink 1.2s steps(2) infinite}
    .anim-side-glow{animation:sideGlow 3s ease-in-out infinite}

    /* 3D scroll / parallax stage */
    .scroll3d{perspective:1200px}
    .scroll3d > *{transform-style:preserve-3d}
    .parallax-img{background-attachment:scroll;background-size:cover;background-position:center}

    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-track{background:#000}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:9999px}

    @media (prefers-reduced-motion:reduce){
      .nebula,.shooting-star,.soft-pulse,.anim-floatUp,.anim-floatDown,.anim-spinSlow,.anim-spinBack,.anim-orbit,
      .anim-breathe,.anim-flicker,.anim-twinkle,.anim-comet,.anim-ring-pulse,.anim-wave,.anim-sweep::after,.star,
      .anim-driftX,.anim-driftY,.anim-tiltZ,.anim-scaleP,.anim-blur-pulse,.anim-rotate3d,.anim-bob,.anim-flipY,
      .anim-pop-in,.anim-fade-in,.anim-rise,.anim-blink,.anim-side-glow,.anim-gradient-flow{animation:none!important}
    }
  </style>
</head>
<body class="antialiased min-h-screen relative">
  <div class="fixed inset-0 z-0 pointer-events-none"><div class="absolute inset-0 bg-black"></div></div>
  <div id="scroll-progress"></div>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useRef, useState, useCallback } = React;
    const { motion, useScroll, useSpring, useTransform } = window.Motion;

    /* ---------- WebAudio SFX — 20 futuristic sounds ---------- */
    const SFX = (() => {
      let ctx=null, enabled=true;
      const ac=()=>{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; };
      const osc=(type,f0,f1,dur,peak=0.1,delay=0)=>{ if(!enabled) return; const c=ac(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain(); o.type=type; if(Array.isArray(f0)){o.frequency.setValueAtTime(f0[0],t);f0.slice(1).forEach((f,i)=>o.frequency.exponentialRampToValueAtTime(f,t+((i+1)/f0.length)*dur));} else {o.frequency.value=f0; if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);} g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur); };
      const noise=(dur,f0,f1,peak=0.3,type='bandpass')=>{ if(!enabled) return; const c=ac(),t=c.currentTime,n=c.createBufferSource(),buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=buf; const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur); f.Q.value=1.4; const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); n.connect(f); f.connect(g).connect(c.destination); n.start(t); n.stop(t+dur); };
      return {
        hover:()=>osc('sine',1500,null,0.05,0.015),
        click:()=>osc('square',880,700,0.07,0.05),
        tick:()=>osc('square',1500,null,0.03,0.04),
        success:()=>{osc('sine',660,null,0.22,0.1);osc('sine',990,null,0.22,0.08,0.08);},
        error:()=>osc('sawtooth',220,110,0.25,0.12),
        whoosh:()=>noise(0.5,200,3000,0.3),
        warp:()=>{noise(0.6,200,3600,0.4);osc('sine',90,40,0.6,0.25);},
        launch:()=>noise(0.8,150,2500,0.35),
        orbit:()=>{[520,780,1040].forEach((f,i)=>osc('sine',f,null,0.3,0.05,i*0.06));},
        chime:()=>{[880,1108,1318].forEach((f,i)=>osc('sine',f,null,0.5,0.06,i*0.05));},
        glitch:()=>{osc('square',200,1600,0.08,0.08);osc('square',1600,200,0.08,0.08,0.06);},
        pulse:()=>osc('sine',440,880,0.15,0.08),
        sweep:()=>noise(0.35,500,2500,0.2,'highpass'),
        deep:()=>osc('sine',70,45,0.6,0.25),
        spark:()=>{osc('square',2400,null,0.04,0.05);osc('square',3200,null,0.04,0.04,0.02);},
        wave:()=>{[300,380,460].forEach((f,i)=>osc('triangle',f,null,0.4,0.05,i*0.04));},
        scan:()=>{osc('sine',1200,2400,0.2,0.04);osc('sine',2400,1200,0.2,0.04,0.2);},
        beacon:()=>{osc('sine',660,null,0.08,0.06);setTimeout(()=>osc('sine',660,null,0.08,0.06),0.14);},
        whoop:()=>osc('sine',500,1200,0.3,0.06),
        toggle:()=>{enabled=!enabled; if(enabled) osc('sine',1200,null,0.08,0.06); else osc('square',300,200,0.1,0.05); return enabled;},
        isOn:()=>enabled,
        play:(n)=>{ if(SFX[n]) SFX[n](); },
      };
    })();

    /* ---------- FadingVideo: rAF crossfade (exact spec) ---------- */
    const FADE_MS=500, FADE_OUT_LEAD=0.55;
    function FadingVideo({ src, className, style }){
      const ref=useRef(null), rafRef=useRef(null), fadingOutRef=useRef(false);
      const fadeTo=useCallback((target,duration)=>{ const el=ref.current; if(!el) return; if(rafRef.current) cancelAnimationFrame(rafRef.current); const start=performance.now(), startO=parseFloat(el.style.opacity)||0, diff=target-startO; const step=(now)=>{ const p=Math.min(1,(now-start)/duration); el.style.opacity=startO+diff*p; if(p<1) rafRef.current=requestAnimationFrame(step); }; rafRef.current=requestAnimationFrame(step); },[]);
      useEffect(()=>{ const el=ref.current; if(!el) return;
        const onLoaded=()=>{el.style.opacity=0;el.play();fadeTo(1,FADE_MS);};
        const onTime=()=>{ if(!fadingOutRef.current && el.duration-el.currentTime<=FADE_OUT_LEAD && el.duration-el.currentTime>0){ fadingOutRef.current=true; fadeTo(0,FADE_MS); } };
        const onEnded=()=>{ el.style.opacity=0; setTimeout(()=>{ el.currentTime=0; el.play(); fadingOutRef.current=false; fadeTo(1,FADE_MS); if(SFX.isOn()) SFX.wave(); },100); };
        el.addEventListener('loadeddata',onLoaded); el.addEventListener('timeupdate',onTime); el.addEventListener('ended',onEnded);
        return ()=>{ el.removeEventListener('loadeddata',onLoaded); el.removeEventListener('timeupdate',onTime); el.removeEventListener('ended',onEnded); if(rafRef.current) cancelAnimationFrame(rafRef.current); };
      },[fadeTo]);
      return <video ref={ref} src={src} autoPlay muted playsInline preload="auto" style={{opacity:0,...style}} className={className} />;
    }

    /* ---------- BlurText ---------- */
    function BlurText({ text, className }){
      const ref=useRef(null), [inView,setInView]=useState(false);
      useEffect(()=>{ const el=ref.current; if(!el) return; const o=new IntersectionObserver(e=>{ if(e[0].isIntersecting) setInView(true); },{threshold:0.1}); o.observe(el); return ()=>o.disconnect(); },[]);
      return <p ref={ref} className={"flex flex-wrap justify-center gap-x-0 "+(className||'')} style={{rowGap:'0.1em'}}>{text.split(' ').map((w,i)=>(
        <motion.span key={i} initial={{filter:'blur(10px)',opacity:0,y:50}} animate={inView?{filter:['blur(10px)','blur(5px)','blur(0px)'],opacity:[0,0.5,1],y:[50,-5,0]}:{}} transition={{duration:0.7,times:[0,0.5,1],ease:'easeOut',delay:(i*100)/1000}} style={{display:'inline-block',marginRight:'0.28em'}}>{w}</motion.span>
      ))}</p>;
    }

    /* helpers */
    const ArrowUpRight=()=>(<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>);
    const Play=()=>(<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>);
    const Clock=()=>(<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>);
    const Globe=()=>(<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>);
    const MImage=()=>(<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z"/></svg>);
    const MMovie=()=>(<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z"/></svg>);
    const MLight=()=>(<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z"/></svg>);

    function Magnetic({ children, strength=0.35 }){ const ref=useRef(null); return <div ref={ref} onPointerMove={e=>{const el=ref.current;if(!el)return;const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*strength}px,${(e.clientY-r.top-r.height/2)*strength}px)`;}} onPointerLeave={()=>{if(ref.current)ref.current.style.transform='translate(0,0)';}} className="inline-block transition-transform duration-300" style={{transitionTimingFunction:'cubic-bezier(.22,1,.36,1)'}}>{children}</div>; }

    function useInView(ref, threshold=0.3){ const [v,setV]=useState(false); useEffect(()=>{ const el=ref.current; if(!el) return; const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){setV(true);o.disconnect();}},{threshold}); o.observe(el); return ()=>o.disconnect(); },[ref,threshold]); return v; }
    function CountUp({to,suffix='',duration=1.6}){ const ref=useRef(null); const inView=useInView(ref); const [val,setVal]=useState(0); useEffect(()=>{ if(!inView) return; let raf; const start=performance.now(); const tick=(now)=>{ const p=Math.min(1,(now-start)/(duration*1000)); setVal(Math.floor((1-Math.pow(1-p,3))*to)); if(p<1) raf=requestAnimationFrame(tick); }; raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf); },[inView,to,duration]); return <span ref={ref}>{val.toLocaleString()}{suffix}</span>; }
    function TiltCard({ children, className }){ const ref=useRef(null); return <div ref={ref} onPointerMove={e=>{const el=ref.current;if(!el)return;const r=el.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;el.style.transform=`perspective(900px) rotateY(${px*10}deg) rotateX(${-py*10}deg) translateZ(0)`;}} onPointerLeave={()=>{if(ref.current)ref.current.style.transform='';}} className={"tilt-card "+(className||'')}>{children}</div>; }

    /* ---------- Global effects: 20 sounds + ripple + scroll progress ---------- */
    function GlobalEffects(){
      useEffect(()=>{
        let lastHover=0, lastReveal=0;
        const onOver=(e)=>{ const t=e.target.closest('button,a,[data-sfx]'); if(!t) return; const now=Date.now(); if(now-lastHover<70) return; lastHover=now; if(t.hasAttribute('data-sfx')){SFX.play(t.getAttribute('data-sfx'));return;} if(t.closest('a')) SFX.tick(); else SFX.hover(); };
        const onClick=(e)=>{ const t=e.target.closest('button,a'); if(!t) return; if(t.hasAttribute('data-sfx')) SFX.play(t.getAttribute('data-sfx')); else if(t.classList.contains('liquid-glass-strong')) SFX.launch(); else if(t.closest('a')) SFX.scan(); else SFX.click(); const r=t.getBoundingClientRect(); const ri=document.createElement('span'); ri.style.cssText='position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:60;'; ri.style.left=(e.clientX-r.left)+'px'; ri.style.top=(e.clientY-r.top)+'px'; t.appendChild(ri); ri.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:'translate(-50%,-50%) scale(8)',opacity:0}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'}).onfinish=()=>ri.remove(); };
        const bar=document.getElementById('scroll-progress');
        const onScroll=()=>{ const h=document.documentElement; const p=h.scrollTop/(h.scrollHeight-h.clientHeight); if(bar) bar.style.width=(p*100)+'%'; };
        const obs=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ const now=Date.now(); if(now-lastReveal>900){ lastReveal=now; SFX.whoosh(); } } }); },{threshold:0.15});
        document.querySelectorAll('section').forEach(s=>obs.observe(s));
        document.addEventListener('pointerover',onOver); document.addEventListener('click',onClick); window.addEventListener('scroll',onScroll,{passive:true});
        return ()=>{ document.removeEventListener('pointerover',onOver); document.removeEventListener('click',onClick); window.removeEventListener('scroll',onScroll); obs.disconnect(); };
      },[]);
      return null;
    }

                <TiltCard className="liquid-glass rounded-[1.25rem] overflow-hidden">
                  <div className="h-36 parallax-img" style={{backgroundImage:"url("+c.img+")"}}/>
                  <div className="p-4"><div className="font-heading italic text-white text-lg">{c.t}</div><div className="text-xs text-white/70 font-body mt-1">{c.d}</div></div>
                </TiltCard>
              </motion.div>
            ))}
          </div>
        </div>
      </section>;
    }

    /* ---------- Mission timeline + stats ---------- */
    const MILESTONES=['Orbital certification','First crewed flight','Lunar gateway open','Mars arrival 2026'];
    function Mission(){ return <section className="relative px-8 md:px-16 lg:px-20 py-28 bg-black overflow-hidden">
      <div className="nebula" style={{width:'50vw',height:'50vw',top:'-20%',right:'-10%',background:'radial-gradient(circle,rgba(255,255,255,.06),transparent 70%)'}}/>
      <div className="grid md:grid-cols-2 gap-12 items-start">
        <div>
          <motion.p initial={{filter:'blur(10px)',opacity:0,y:20}} whileInView={{filter:'blur(0px)',opacity:1,y:0}} viewport={{once:true}} transition={{duration:0.8,ease:'easeOut'}} className="text-sm font-body text-white/80 mb-4">// Mission Timeline</motion.p>
          <div className="relative pl-6 border-l border-white/20">{MILESTONES.map((m,i)=>(
            <motion.div key={m} initial={{opacity:0,x:-20}} whileInView={{opacity:1,x:0}} viewport={{once:true}} transition={{duration:0.5,delay:i*0.12}} className="relative mb-8 anim-rise">
              <span className={"absolute -left-[30px] top-1 w-3 h-3 rounded-full border anim-ring-pulse "+(i<3?"bg-white":"bg-white/40")}/>
              <div className="font-heading italic text-xl text-white anim-driftX" style={{animationDelay:(i*0.6)+'s'}}>{m}</div>
              <div className="text-xs text-white/60 font-body mt-1 anim-blink">{i<3?'COMPLETED':'IN PROGRESS'}</div>
            </motion.div>
          ))}</div>
        </div>
        <div className="grid grid-cols-2 gap-6">{[['1200','Crew Trained'],['18','Active Vessels'],['99.9','Launch Success %'],['50','Partner Nations']].map(([n,label],i)=>(
          <motion.div key={label} initial={{opacity:0,y:20}} whileInView={{opacity:1,y:0}} viewport={{once:true}} transition={{duration:0.5,delay:i*0.1}} className="liquid-glass rounded-[1.25rem] p-6 anim-side-glow">
            <div className="font-heading italic text-4xl text-white leading-none anim-gradient-flow"><CountUp to={parseInt(n)} suffix={n.includes('.')?'%':'+'}/></div>
            <div className="text-xs text-white/70 font-body mt-2 anim-fade-in">{label}</div>
          </motion.div>
        ))}</div>
      </div>
    </section>; }

    /* ---------- FAQ (5) ---------- */
    const FAQS=[['How safe is a voyage?','Every craft exceeds the industry safety standard, with triple-redundant life support, abort-at-any-phase escape systems, and a full crewed test program behind each class.'],
      ['What does a ticket include?','Transit, quarters, training, mission support, meals, and insurance. Your deciding factor is which destination suits your experience level and appetite for risk.'],
      ['Can I bring a guest or family?','Yes. Group and family cabins are available on Lunar Gateway and Mars Colony, subject to medical clearance and shared training.'],
      ['What about zero-g health effects?','Crew undergo a graded conditioning program before, during, and after flight. Rotational-gravity habitation keeps Lunar and Mars residents within comfort limits.'],
      ['How do refunds and reschedules work?','Full refunds up to 90 days out; free rescheduling once. The terms page details cancellation windows and force-majeure coverage.']];
    function FAQ(){ return <section className="relative px-8 md:px-16 lg:px-20 py-28 bg-black">
      <motion.p initial={{filter:'blur(10px)',opacity:0,y:20}} whileInView={{filter:'blur(0px)',opacity:1,y:0}} viewport={{once:true}} transition={{duration:0.8,ease:'easeOut'}} className="text-sm font-body text-white/80 mb-4">// FAQ</motion.p>
      <motion.h2 initial={{filter:'blur(10px)',opacity:0,y:30}} whileInView={{filter:'blur(0px)',opacity:1,y:0}} viewport={{once:true}} transition={{duration:0.8,ease:'easeOut'}} className="font-heading italic text-white text-6xl md:text-7xl leading-[0.9] tracking-[-3px] mb-14">Good <span className="text-shine">questions</span></motion.h2>
      <div className="max-w-3xl space-y-3">{FAQS.map((f,i)=>(
        <motion.div key={f[0]} initial={{opacity:0,y:20}} whileInView={{opacity:1,y:0}} viewport={{once:true}} transition={{duration:0.5,delay:i*0.08}} className="liquid-glass rounded-[1.25rem] overflow-hidden">
          <button data-sfx="beacon" className="w-full flex items-center justify-between px-6 py-4 text-left anim-sweep"><span className="font-heading italic text-white text-xl">{f[0]}</span><span className="text-white/60">+</span></button>
          <div className="px-6 pb-4 text-sm text-white/80 font-body font-light leading-snug">{f[1]}</div>
        </motion.div>
      ))}</div>
    </section>; }

    /* ---------- CTA + marquee + footer ---------- */
    function CTA(){ return <section id="planlaunch" className="relative px-8 md:px-16 lg:px-20 py-28 bg-black">
      <div className="marquee overflow-hidden liquid-glass rounded-full py-3 mb-14"><div className="marquee-track gap-8 px-4">{[0,1].map(k=>['THE FUTURE IS CLOSER THAN YOU THINK',' · ','BOOK YOUR VOYAGE',' · ','SPACE IS OPEN',' · ','MAIDEN MARS FLIGHT 2026',' · '].map((t,i)=>(<span key={k+'-'+i} className={"font-heading italic text-2xl text-white/70 whitespace-nowrap "+(t===' · '?'':'px-2')}>{t}</span>)))}</div></div>
      <motion.div initial={{filter:'blur(10px)',opacity:0,y:30}} whileInView={{filter:'blur(0px)',opacity:1,y:0}} viewport={{once:true}} transition={{duration:0.9,ease:'easeOut'}} className="text-center">
        <h2 className="font-heading italic text-white text-6xl md:text-7xl leading-[0.9] tracking-[-3px] max-w-3xl mx-auto">The universe is waiting.</h2>
        <p className="text-white/80 font-body font-light mt-4 max-w-xl mx-auto">Reserve your place aboard the next departure. Seats are limited; the stars are not.</p>
        <div className="flex items-center justify-center gap-6 mt-8">
          <Magnetic><button data-sfx="launch" className="liquid-glass-strong soft-pulse rounded-full px-6 py-3 text-sm text-white flex items-center gap-2">Start Your Voyage <ArrowUpRight/></button></Magnetic>
          <Magnetic><a href="terms.html" data-sfx="scan" className="flex items-center gap-2 text-white text-sm"><span className="anim-glow-pulse"><Play/></span> Terms &amp; Conditions</a></Magnetic>
        </div>
      </motion.div>
      <footer className="mt-20 px-8 py-8 text-center text-xs text-white/40 font-body border-t border-white/10 anim-fade-in">© 2026 Orbital — A cinematic space travel experience. <a href="terms.html" className="underline hover:text-white">Terms</a> · <a href="#faq" className="underline hover:text-white">FAQ</a></footer>
    </section>; }

    /* ---------- App ---------- */
    function App(){ return <><GlobalEffects/><Hero/><Capabilities/><Voyages/><Compare/><Experiences/><Crew/><Mission/><div id="faq"><FAQ/></div><CTA/></>; }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
