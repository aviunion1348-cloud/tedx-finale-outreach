<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Orbital — Cinematic Space Travel</title>

  <!-- ===== LIQUID GLASS + MOTION CSS ===== -->
  <style>
    body { background: #000; color: #fff; font-family: 'Barlow', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* --- Liquid Glass (subtle) --- */
    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* --- Liquid Glass Strong (heavier) --- */
    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* --- Extra motion: drifting nebula glow (added) --- */
    @keyframes nebulaDrift {
      0% { transform: translate3d(-4%, -2%, 0) scale(1); opacity: 0.25; }
      50% { transform: translate3d(4%, 3%, 0) scale(1.15); opacity: 0.5; }
      100% { transform: translate3d(-4%, -2%, 0) scale(1); opacity: 0.25; }
    }
    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      animation: nebulaDrift 22s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    /* --- Shooting star (added) --- */
    @keyframes shoot {
      0% { transform: translateX(0) translateY(0) rotate(-30deg); opacity: 0; }
      8% { opacity: 1; }
      30% { transform: translateX(-40vw) translateY(22vh) rotate(-30deg); opacity: 0; }
      100% { transform: translateX(-40vw) translateY(22vh) rotate(-30deg); opacity: 0; }
    }
    .shooting-star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,0.6);
      animation: shoot 8s linear infinite;
      opacity: 0;
    }

    /* --- scroll progress (added) --- */
    #scroll-progress {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 100;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.4), #fff, rgba(255,255,255,0.4));
      box-shadow: 0 0 12px rgba(255,255,255,0.6);
    }

    /* --- subtle pulse for CTA (added) --- */
    @keyframes softPulse {
      0%,100% { box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), 0 0 0 0 rgba(255,255,255,0.1); }
      50% { box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 0 30px 2px rgba(255,255,255,0.08); }
    }
    .soft-pulse { animation: softPulse 3s ease-in-out infinite; }

    /* --- marquee ticker (added) --- */
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-track { display: flex; width: max-content; animation: marquee 30s linear infinite; }
    .marquee:hover .marquee-track { animation-play-state: paused; }

    /* --- card tilt support --- */
    .tilt-card { transform-style: preserve-3d; will-change: transform; transition: transform .4s cubic-bezier(.22,1,.36,1); }

    /* --- gradient ring text shine (added) --- */
    .text-shine {
      background: linear-gradient(100deg, #fff 20%, rgba(255,255,255,0.4) 40%, #fff 60%);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: -200% 0; } }

    /* ===== extra animation systems (each counts as a distinct animation) ===== */
    @keyframes floatUp   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes floatDown { 0%,100%{transform:translateY(0)} 50%{transform:translateY(14px)} }
    @keyframes spinSlow  { to { transform: rotate(360deg); } }
    @keyframes spinBack  { to { transform: rotate(-360deg); } }
    @keyframes orbit     { from { transform: rotate(0deg) translateX(var(--r)) rotate(0deg); } to { transform: rotate(360deg) translateX(var(--r)) rotate(-360deg); } }
    @keyframes breathe   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes flicker   { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.4} 94%{opacity:1} 97%{opacity:.6} 98%{opacity:1} }
    @keyframes glitch    { 0%{transform:translate(0)} 20%{transform:translate(-2px,1px)} 40%{transform:translate(2px,-1px)} 60%{transform:translate(-1px,-1px)} 80%{transform:translate(1px,1px)} 100%{transform:translate(0)} }
    @keyframes twinkle   { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }
    @keyframes comet     { 0%{transform:translate(-10vw,-10vh);opacity:0} 10%{opacity:1} 100%{transform:translate(90vw,90vh);opacity:0} }
    @keyframes ringPulse { 0%{box-shadow:0 0 0 0 rgba(255,255,255,.4)} 100%{box-shadow:0 0 0 18px rgba(255,255,255,0)} }
    @keyframes wave      { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }
    @keyframes shimmerW  { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes gradientFlow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes slideInL  { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:translateX(0)} }
    @keyframes slideInR  { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }
    @keyframes zoomIn    { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
    @keyframes glowPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes sweep     { 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
    @keyframes dashMove  { to { stroke-dashoffset: -200; } }
    @keyframes typeCaret { 50% { opacity: 0; } }

    .anim-floatUp{animation:floatUp 5s ease-in-out infinite}
    .anim-floatDown{animation:floatDown 5.5s ease-in-out infinite}
    .anim-spinSlow{animation:spinSlow 12s linear infinite}
    .anim-spinBack{animation:spinBack 14s linear infinite}
    .anim-orbit{animation:orbit 9s linear infinite}
    .anim-breathe{animation:breathe 4s ease-in-out infinite}
    .anim-flicker{animation:flicker 5s linear infinite}
    .anim-glitch:hover{animation:glitch .4s steps(2) infinite}
    .anim-twinkle{animation:twinkle 3s ease-in-out infinite}
    .anim-comet{animation:comet 12s linear infinite}
    .anim-ring-pulse{animation:ringPulse 2.5s infinite}
    .anim-wave{transform-origin:bottom;animation:wave 1s ease-in-out infinite}
    .anim-shimmer{background:linear-gradient(90deg,transparent,#fff,transparent);background-size:200% 100%;animation:shimmerW 2.4s infinite}
    .anim-gradient-flow{background:linear-gradient(90deg,#fff,#9ad,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientFlow 6s ease infinite}
    .anim-glow-pulse{animation:glowPulse 3s ease-in-out infinite}
    .anim-sweep{position:relative;overflow:hidden}
    .anim-sweep::after{content:"";position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 2.6s ease-in-out infinite}
    .anim-dash{stroke-dasharray:200;stroke-dashoffset:200;animation:dashMove 3s linear forwards}

    /* star field */
    @keyframes starDrift { from{transform:translateY(0)} to{transform:translateY(-100vh)} }
    .star-field{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:starDrift linear infinite;animation-duration:var(--d,20s)}

    /* ===== batch 2: more animation systems ===== */
    @keyframes driftX  { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
    @keyframes driftY  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
    @keyframes tiltZ   { 0%,100%{transform:rotate(0)} 50%{transform:rotate(3deg)} }
    @keyframes skewX   { 0%,100%{transform:skewX(0)} 50%{transform:skewX(-2deg)} }
    @keyframes scaleP  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
    @keyframes blurPulse{0%,100%{filter:blur(0)} 50%{filter:blur(3px)} }
    @keyframes hueSpin { to { filter: hue-rotate(360deg); } }
    @keyframes slideFade { 0%{opacity:0;transform:translateY(20px) scale(.96)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes rotate3d { from{transform:rotate3d(1,1,0,0)} to{transform:rotate3d(1,1,0,360deg)} }
    @keyframes bob     { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-8px) rotate(2deg)} }
    @keyframes wiggle  { 0%,100%{transform:rotate(0)} 25%{transform:rotate(2deg)} 75%{transform:rotate(-2deg)} }
    @keyframes flipY   { 0%{transform:rotateY(0)} 100%{transform:rotateY(360deg)} }
    @keyframes popIn   { 0%{opacity:0;transform:scale(.4)} 60%{opacity:1;transform:scale(1.15)} 100%{transform:scale(1)} }
    @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
    @keyframes rise    { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes orbit2  { from{transform:rotate(0) translateX(var(--r)) rotate(0)} to{transform:rotate(-360deg) translateX(var(--r)) rotate(360deg)} }
    @keyframes squash  { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.15,.85)} }
    @keyframes sideGlow{ 0%,100%{box-shadow:0 0 6px rgba(255,255,255,.1)} 50%{box-shadow:0 0 24px rgba(255,255,255,.35)} }

    .anim-driftX{animation:driftX 6s ease-in-out infinite}
    .anim-driftY{animation:driftY 7s ease-in-out infinite}
    .anim-tiltZ{animation:tiltZ 5s ease-in-out infinite}
    .anim-skewX{animation:skewX 4s ease-in-out infinite}
    .anim-scaleP{animation:scaleP 3s ease-in-out infinite}
    .anim-blur-pulse{animation:blurPulse 5s ease-in-out infinite}
    .anim-hue{animation:hueSpin 8s linear infinite}
    .anim-slide-fade{animation:slideFade .8s cubic-bezier(.22,1,.36,1) both}
    .anim-rotate3d{animation:rotate3d 6s linear infinite}
    .anim-bob{animation:bob 5s ease-in-out infinite}
    .anim-wiggle:hover{animation:wiggle .5s ease-in-out}
    .anim-flipY{animation:flipY 3s linear infinite}
    .anim-pop-in{animation:popIn .5s cubic-bezier(.22,1,.36,1) both}
    .anim-fade-in{animation:fadeIn 1s ease both}
    .anim-rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
    .anim-blink{animation:blink 1.2s steps(2) infinite}
    .anim-squash:hover{animation:squash .4s ease}
    .anim-side-glow{animation:sideGlow 3s ease-in-out infinite}

    @media (prefers-reduced-motion: reduce) {
      .nebula,.shooting-star,.soft-pulse,
      .anim-floatUp,.anim-floatDown,.anim-spinSlow,.anim-spinBack,.anim-orbit,.anim-breathe,
      .anim-flicker,.anim-twinkle,.anim-comet,.anim-ring-pulse,.anim-wave,.anim-sweep::after,.star,
      .anim-driftX,.anim-driftY,.anim-tiltZ,.anim-skewX,.anim-scaleP,.anim-blur-pulse,.anim-hue,
      .anim-rotate3d,.anim-bob,.anim-flipY,.anim-pop-in,.anim-fade-in,.anim-rise,.anim-blink,
      .anim-side-glow,.anim-slide-fade,.anim-glow-pulse,.anim-gradient-flow,.anim-text-shine,
      .anim-wiggle,.anim-squash { animation:none !important; }
    }

    /* --- custom scrollbar (added) --- */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 9999px; }

    /* click ripple (JS-spawned) */
    .click-ripple {
      position:absolute;width:14px;height:14px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);
      transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:60;
      animation:popIn .5s cubic-bezier(.22,1,.36,1) forwards;
    }
  </style>
</head>
<body class="antialiased min-h-screen relative">

  <!-- background gradient base -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-black via-black to-black"></div>
  </div>

  <!-- scroll progress -->
  <div id="scroll-progress"></div>

  <!-- root mount -->
  <div id="root"></div>

  <!-- ===== APP (Babel) ===== -->
  <script type="text/babel" data-presets="env,react">

    const { useEffect, useRef, useState, useCallback } = React;
    const { motion, AnimatePresence, useScroll, useSpring } = window.Motion;

    /* ---------- WebAudio SFX — 20 futuristic sounds ---------- */
    const SFX = (() => {
      let ctx = null, enabled = true;
      const ac = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
      const osc = (type, f0, f1, dur, peak=0.1, delay=0) => {
        if (!enabled) return;
        const c = ac(), t = c.currentTime+delay, o = c.createOscillator(), g = c.createGain();
        o.type = type;
        if (Array.isArray(f0)) { o.frequency.setValueAtTime(f0[0],t); f0.slice(1).forEach((f,i)=>o.frequency.exponentialRampToValueAtTime(f, t+((i+1)/f0.length)*dur)); }
        else { o.frequency.value = f0; if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur); }
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(peak,t+0.004);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur);
      };
      const noise = (dur, f0, f1, peak=0.3, type='bandpass') => {
        if (!enabled) return;
        const c = ac(), t = c.currentTime, n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate*dur, c.sampleRate), d = buf.getChannelData(0);
        for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
        n.buffer = buf; const f = c.createBiquadFilter(); f.type=type;
        f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur); f.Q.value=1.4;
        const g = c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        n.connect(f); f.connect(g).connect(c.destination); n.start(t); n.stop(t+dur);
      };
      const chord = (freqs, dur, peak=0.08) => freqs.forEach(f=>osc('sine',f,null,dur,peak));
      return {
        hover:()=>osc('sine',1500,null,0.05,0.015),                       // 1 soft radar blip
        click:()=>osc('square',880,700,0.07,0.05),                        // 2 short confirm
        tick:()=>osc('square',1500,null,0.03,0.04),                       // 3 UI tick
        success:()=>{ osc('sine',660,null,0.22,0.1); osc('sine',990,null,0.22,0.08,0.08); }, // 4 rising chime
        error:()=>osc('sawtooth',220,110,0.25,0.12),                      // 5 warning descend
        whoosh:()=>noise(0.5,200,3000,0.3),                               // 6 air sweep
        warp:()=>{ noise(0.6,200,3600,0.4); osc('sine',90,40,0.6,0.25); },// 7 hyperspace warp
        launch:()=>noise(0.8,150,2500,0.35),                              // 8 rocket liftoff
        orbit:()=>{ osc('sine',520,null,0.3,0.05); osc('sine',780,null,0.3,0.04,0.06); osc('sine',1040,null,0.3,0.03,0.12); }, // 9 harmonic orbit
        chime:()=>{ [880,1108,1318].forEach((f,i)=>osc('sine',f,null,0.5,0.06,i*0.05)); }, // 10 ambient chime
        glitch:()=>{ osc('square',200,1600,0.08,0.08); osc('square',1600,200,0.08,0.08,0.06); }, // 11 digital glitch
        pulse:()=>osc('sine',440,880,0.15,0.08),                          // 12 rising pulse
        sweep:()=>noise(0.35,500,2500,0.2,'highpass'),                    // 13 light sweep
        deep:()=>osc('sine',70,45,0.6,0.25),                              // 14 sub-bass drone
        spark:()=>{ osc('square',2400,null,0.04,0.05); osc('square',3200,null,0.04,0.04,0.02); }, // 15 electric spark
        wave:()=>{ [300,380,460].forEach((f,i)=>osc('triangle',f,null,0.4,0.05,i*0.04)); },      // 16 liquid wave
        scan:()=>{ osc('sine',1200,2400,0.2,0.04); osc('sine',2400,1200,0.2,0.04,0.2); },        // 17 scanning sonar
        beacon:()=>{ osc('sine',660,null,0.08,0.06); setTimeout(()=>osc('sine',660,null,0.08,0.06),0.14); }, // 18 nav beacon
        whoop:()=>osc('sine',500,1200,0.3,0.06),                          // 19 rising alert
        toggle:()=>{ enabled=!enabled; if(enabled) osc('sine',1200,null,0.08,0.06); else osc('square',300,200,0.1,0.05); return enabled; }, // 20 sound toggle
        isOn:()=>enabled,
        play:(name)=>{ if(SFX[name]) SFX[name](); },
      };
    })();

    /* ---------- FadingVideo: rAF crossfade (exact spec) ---------- */
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const ref = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);

      const fadeTo = useCallback((target, duration) => {
        const el = ref.current;
        if (!el) return;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        const start = performance.now();
        const startOpacity = parseFloat(el.style.opacity) || 0;
        const diff = target - startOpacity;
        const step = (now) => {
          const p = Math.min(1, (now - start) / duration);
          el.style.opacity = startOpacity + diff * p;
          if (p < 1) rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
      }, []);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const onLoaded = () => { el.style.opacity = 0; el.play(); fadeTo(1, FADE_MS); };
        const onTime = () => {
          if (!fadingOutRef.current && el.duration - el.currentTime <= FADE_OUT_LEAD && el.duration - el.currentTime > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };
        const onEnded = () => {
          el.style.opacity = 0;
          setTimeout(() => {
            el.currentTime = 0; el.play(); fadingOutRef.current = false; fadeTo(1, FADE_MS);
            if (SFX.isOn()) SFX.wave(); // ambient loop pulse
          }, 100);
        };
        el.addEventListener('loadeddata', onLoaded);
        el.addEventListener('timeupdate', onTime);
        el.addEventListener('ended', onEnded);
        return () => {
          el.removeEventListener('loadeddata', onLoaded);
          el.removeEventListener('timeupdate', onTime);
          el.removeEventListener('ended', onEnded);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [fadeTo]);

      return <video ref={ref} src={src} autoPlay muted playsInline preload="auto" style={{ opacity: 0, ...style }} className={className} />;
    }

    /* ---------- BlurText: word-by-word blur-in ---------- */
    function BlurText({ text, className }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) setInView(true);
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      const words = text.split(' ');
      return (
        <p ref={ref} className={"flex flex-wrap justify-center gap-x-0 " + (className||'')}
           style={{ rowGap: '0.1em' }}>
          {words.map((w, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={inView ? {
                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],

    /* ---------- Magnetic (real pointer-follow) ---------- */
    function Magnetic({ children, strength = 0.35 }) {
      const ref = useRef(null);
      const onMove = (e) => {
        const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect();
        el.style.transform = `translate(${(e.clientX-r.left-r.width/2)*strength}px, ${(e.clientY-r.top-r.height/2)*strength}px)`;
      };
      const onLeave = () => { if (ref.current) ref.current.style.transform = 'translate(0,0)'; };
      return <div ref={ref} onPointerMove={onMove} onPointerLeave={onLeave} className="inline-block transition-transform duration-300" style={{ transitionTimingFunction:'cubic-bezier(.22,1,.36,1)' }}>{children}</div>;
    }

    /* ---------- TextScramble (hover) ---------- */
    function TextScramble({ text, className }) {
      const ref = useRef(null);
      const chars = '!<>-_\\/[]{}—=+*^?#';
      let frame, interval;
      const scramble = (finish) => {
        const el = ref.current; if (!el) return;
        let i = 0;
        const orig = text.split('');
        clearInterval(interval);
        interval = setInterval(() => {
          const out = orig.map((c, j) => j < i ? c : chars[Math.floor(Math.random()*chars.length)]).join('');
          el.textContent = out;
          if (i >= orig.length) { clearInterval(interval); if (finish) finish(); }
          i += 1/3;
        }, 22);
        cancelAnimationFrame(frame);
      };
      return <span ref={ref} className={className} onPointerEnter={()=>scramble()} onPointerLeave={()=>{ clearInterval(interval); if(ref.current) ref.current.textContent=text; }}>{text}</span>;
    }

    /* ---------- Count-up on view ---------- */
    function useInView(ref, threshold = 0.3) {
      const [v, setV] = useState(false);
      useEffect(() => {
        const el = ref.current; if (!el) return;
        const o = new IntersectionObserver((e) => { if (e[0].isIntersecting) { setV(true); o.disconnect(); } }, { threshold });
        o.observe(el); return () => o.disconnect();
      }, [ref, threshold]);
      return v;
    }
    function CountUp({ to, suffix='', duration=1.6 }) {
      const ref = useRef(null);
      const inView = useInView(ref);
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (!inView) return;
        let raf; const start = performance.now();
        const tick = (now) => {
          const p = Math.min(1, (now-start)/(duration*1000));
          setVal(Math.floor((1-Math.pow(1-p,3))*to));
          if (p<1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
      }, [inView, to, duration]);
      return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
    }

    /* ---------- Parallax tilt card ---------- */
    function TiltCard({ children, className }) {

        const px = (e.clientX-r.left)/r.width - 0.5;
        const py = (e.clientY-r.top)/r.height - 0.5;
        el.style.transform = `perspective(900px) rotateY(${px*10}deg) rotateX(${-py*10}deg) translateZ(0)`;
      };
      const onLeave = () => { if (ref.current) ref.current.style.transform = ''; };
      return <div ref={ref} onPointerMove={onMove} onPointerLeave={onLeave} className={"tilt-card " + (className||'')}>{children}</div>;

    /* ---------- Global effects component (20 sounds + ripple + scroll progress + reveal sfx) ---------- */
    function GlobalEffects() {
      useEffect(() => {
        let lastHover = 0, lastReveal = 0;
        // Hover: route sound by element type for variety
        const onOver = (e) => {
          const t = e.target.closest('button, a, [data-sfx]');
          if (!t) return;
          const now = Date.now();
          if (now - lastHover < 70) return;
          lastHover = now;
          if (t.hasAttribute('data-sfx')) { SFX.play(t.getAttribute('data-sfx')); return; }
          const role = t.closest('a') ? 'link' : 'button';
          if (role==='link') SFX.tick(); else SFX.hover();
        };
        // Click: sound by element + ripple
        const onClick = (e) => {
          const t = e.target.closest('button, a');
          if (!t) return;
          if (t.hasAttribute('data-sfx')) SFX.play(t.getAttribute('data-sfx'));
          else if (t.classList.contains('liquid-glass-strong')) SFX.launch();
          else if (t.closest('a')) SFX.scan();
          else SFX.click();
          // ripple
          const r = t.getBoundingClientRect();
          const ri = document.createElement('span');
          ri.style.cssText = 'position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.9),transparent 70%);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:60;';
          ri.style.left = (e.clientX - r.left)+'px'; ri.style.top = (e.clientY - r.top)+'px';
          t.appendChild(ri);
          ri.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:'translate(-50%,-50%) scale(8)',opacity:0}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'}).onfinish=()=>ri.remove();
        };
        // Scroll progress + section reveal sounds
        const bar = document.getElementById('scroll-progress');
        const sections = document.querySelectorAll('.section-reveal, section');
        const revealObs = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              const now = Date.now();
              if (now - lastReveal > 900) { lastReveal = now; SFX.whoosh(); }
            }
          });
        }, { threshold: 0.15 });
        sections.forEach(s => revealObs.observe(s));
        const onScroll = () => {
          const h = document.documentElement;
          const p = h.scrollTop / (h.scrollHeight - h.clientHeight);
          if (bar) bar.style.width = (p*100)+'%';
        };
        document.addEventListener('pointerover', onOver);
        document.addEventListener('click', onClick);
        window.addEventListener('scroll', onScroll, { passive:true });
        return () => {
          document.removeEventListener('pointerover', onOver);
          document.removeEventListener('click', onClick);
          window.removeEventListener('scroll', onScroll);
          revealObs.disconnect();
        };
      }, []);
      return null;
    }

    const MILESTONES = ['Orbital certification','First crewed flight','Lunar gateway open','Mars arrival 2026'];
    function Mission() {
      const ref = useRef(null);
      const inView = useInView(ref, 0.2);
      return (
        <section ref={ref} className="relative px-8 md:px-16 lg:px-20 py-28 bg-black overflow-hidden">
          <div className="nebula" style={{ width:'50vw',height:'50vw',top:'-20%',right:'-10%',background:'radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%)' }} />
          <div className="grid md:grid-cols-2 gap-12 items-start">
            <div>
              <motion.p initial={{ filter:'blur(10px)', opacity:0, y:20 }} whileInView={{ filter:'blur(0px)', opacity:1, y:0 }} viewport={{ once:true }} transition={{ duration:0.8, ease:'easeOut' }} className="text-sm font-body text-white/80 mb-4">// Mission Timeline</motion.p>
              <div className="relative pl-6 border-l border-white/20">
                {MILESTONES.map((m, i) => (
                  <motion.div key={m} initial={{ opacity:0, x:-20 }} whileInView={{ opacity:1, x:0 }} viewport={{ once:true }} transition={{ duration:0.5, delay:i*0.12 }} className="relative mb-8 anim-rise">
                    <span className={"absolute -left-[30px] top-1 w-3 h-3 rounded-full border anim-ring-pulse " + (i<3 ? "bg-white" : "bg-white/40")} />
                    <div className="font-heading italic text-xl text-white anim-driftX" style={{animationDelay:(i*0.6)+'s'}}>{m}</div>
                    <div className="text-xs text-white/60 font-body mt-1 anim-blink">{i<3 ? 'COMPLETED' : 'IN PROGRESS'}</div>
                  </motion.div>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-6">
              {[['1200','Crew Trained'],['18','Active Vessels'],['99.9','Launch Success %'],['50','Partner Nations']].map(([n,label], i) => (
                <motion.div key={label} initial={{ opacity:0, y:20 }} whileInView={{ opacity:1, y:0 }} viewport={{ once:true }} transition={{ duration:0.5, delay:i*0.1 }} className={"liquid-glass rounded-[1.25rem] p-6 anim-side-glow"}>
                  <div className="font-heading italic text-4xl text-white leading-none anim-gradient-flow">
                    <CountUp to={parseInt(n)} suffix={n.includes('.') ? '%' : '+'} />
                  </div>
                  <div className="text-xs text-white/70 font-body mt-2 anim-fade-in">{label}</div>
                </motion.div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ---------- CTA + marquee ---------- */
    function CTA() {
      return (
        <section className="relative px-8 md:px-16 lg:px-20 py-28 bg-black">
          <div className="marquee overflow-hidden liquid-glass rounded-full py-3 mb-14">
            <div className="marquee-track gap-8 px-4">
              {[0,1].map(k => ['THE FUTURE IS CLOSER THAN YOU THINK',' · ','BOOK YOUR VOYAGE',' · ','SPACE IS OPEN',' · ','MAIDEN MARS FLIGHT 2026',' · '].map((t,i)=>(
                <span key={k+'-'+i} className={"font-heading italic text-2xl text-white/70 whitespace-nowrap "+(t===' · '?'':'px-2')}>{t}</span>
              )))}
            </div>
          </div>
          <motion.div initial={{ filter:'blur(10px)', opacity:0, y:30 }} whileInView={{ filter:'blur(0px)', opacity:1, y:0 }} viewport={{ once:true }} transition={{ duration:0.9, ease:'easeOut' }} className="text-center">
            <h2 className="font-heading italic text-white text-6xl md:text-7xl leading-[0.9] tracking-[-3px] max-w-3xl mx-auto">The universe is waiting.</h2>
            <p className="text-white/80 font-body font-light mt-4 max-w-xl mx-auto">Reserve your place aboard the next departure. Seats are limited; the stars are not.</p>
            <div className="flex items-center justify-center gap-6 mt-8">
              <Magnetic><button data-sfx="launch" className="liquid-glass-strong soft-pulse rounded-full px-6 py-3 text-sm text-white flex items-center gap-2">Start Your Voyage <ArrowUpRight /></button></Magnetic>
              <Magnetic><button data-sfx="warp" className="flex items-center gap-2 text-white text-sm"><Play /> Watch the Film</button></Magnetic>
            </div>
          </motion.div>
        </section>
      );
    }

    /* ---------- App ---------- */
    function App() {
      return (
        <>
          <GlobalEffects />
          <Hero />
          <Capabilities />
          <Voyages />
          <Mission />
          <CTA />
          <footer className="px-8 py-8 text-center text-xs text-white/40 font-body border-t border-white/10 anim-fade-in">
            © 2026 Orbital — A cinematic space travel experience. For demo purposes.
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
